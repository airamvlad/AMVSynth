name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: ""
          - name: macOS
            os: macos-latest
            configure: -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: AMVSynth-${{ matrix.name }}
          path: |
            build/AMVSynth_artefacts/Release/VST3
            build/AMVSynth_artefacts/Release/AU
            build/AMVSynth_artefacts/Release/Standalone
          if-no-files-found: error
